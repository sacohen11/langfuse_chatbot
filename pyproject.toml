[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "langfuse-chatbot"
version = "0.1.0"
description = "LangChain MCP chatbot with Langfuse observability and multi-turn tool-call evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "langchain>=1.0.0",
  "langchain-openai>=1.0.0",
  "langchain-mcp-adapters>=0.1.0",
  "langfuse>=4.7.1",
  "python-dotenv>=1.0.1",
  "pyyaml>=6.0.2",
  "uvicorn[standard]>=0.31.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]
mcp-server = [
  "mcp>=1.13.0",
]

[project.scripts]
langfuse-chatbot = "langfuse_chatbot.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/langfuse_chatbot"]
